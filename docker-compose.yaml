
services:
  db:
    image: postgres:16
    container_name: optiflow_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=optiflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  storage:
    image: quay.io/minio/minio:latest
    container_name: optiflow_storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=optiflow
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001" 

  redis:
    image: redis:latest
    container_name: optiflow_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  web:
    build:
      context: ./frontend
      dockerfile: dockerfile
      args:
        NEXT_PUBLIC_AUTH_SVC_URL: ${NEXT_PUBLIC_AUTH_SVC_URL:-}
        NEXT_PUBLIC_API_SVC_URL: ${NEXT_PUBLIC_API_SVC_URL:-}
        NEXT_PUBLIC_UPLOAD_SVC_URL: ${NEXT_PUBLIC_UPLOAD_SVC_URL:-}
        NEXT_PUBLIC_NOTIFY_SVC_URL: ${NEXT_PUBLIC_NOTIFY_SVC_URL:-}
    image: ${DOCKER_USERNAME:-atulsinghhhh}/optiflow:latest
    container_name: optiflow_web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_AUTH_SVC_URL=${NEXT_PUBLIC_AUTH_SVC_URL}
      - NEXT_PUBLIC_API_SVC_URL=${NEXT_PUBLIC_API_SVC_URL}
      - NEXT_PUBLIC_UPLOAD_SVC_URL=${NEXT_PUBLIC_UPLOAD_SVC_URL}
      - NEXT_PUBLIC_NOTIFY_SVC_URL=${NEXT_PUBLIC_NOTIFY_SVC_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_TRUST_HOST=true
      - NEXTAUTH_URL=http://localhost
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXT_PUBLIC_APP_URL=http://localhost

  nginx:
    image: nginx:alpine
    container_name: optiflow_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
volumes:
  postgres_data:
  minio_data:
  redis_data: