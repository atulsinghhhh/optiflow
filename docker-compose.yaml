
services:
  db:
    image: postgres:16
    container_name: optiflow_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=optiflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  storage:
    image: quay.io/minio/minio:latest
    container_name: optiflow_storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=optiflow
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001" 

  redis:
    image: redis:latest
    container_name: optiflow_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  # worker:
  #   build:
  #     context: .
  #     dockerfile: dockerfile
  #   environment:
  #     DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/optiflow
  #     REDIS_HOST: redis
  #     REDIS_PORT: 6379
  #     MINIO_ENDPOINT: storage
  #     MINIO_PORT: 9000
  #     MINIO_ACCESS_KEY: optiflow
  #     MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  #   depends_on:
  #     - db
  #     - storage
  #     - redis

  web:
    image: ${DOCKER_USERNAME:-atulsinghhhh}/optiflow:latest
    container_name: optiflow_web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@db:5432/optiflow
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=storage
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=optiflow
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
    depends_on:
      - db
      - redis
      - storage

  nginx:
    image: nginx:alpine
    container_name: optiflow_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
volumes:
  postgres_data:
  minio_data:
  redis_data: