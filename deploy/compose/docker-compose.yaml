
# Local dev stack for the StreamVault Go services (auth-svc, api-svc, upload-svc,
# image-worker, video-worker, notify-svc). Separate from the root docker-compose.yaml,
# which runs the existing Next.js/Prisma app — ports are offset from the defaults
# (5435/6381/9010-9011) to avoid colliding with the frontend stack and any other
# local Postgres/Redis/MinIO instances (including a native, non-Docker Postgres).

services:
  db:
    image: postgres:16
    container_name: streamvault_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=streamvault
    ports:
      - "5435:5432"
    volumes:
      - streamvault_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: streamvault_redis
    ports:
      - "6381:6379"
    volumes:
      - streamvault_redis_data:/data

  storage:
    image: quay.io/minio/minio:latest
    container_name: streamvault_storage
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-streamvault}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-streamvault123}
    volumes:
      - streamvault_minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  streamvault_postgres_data:
  streamvault_redis_data:
  streamvault_minio_data:
